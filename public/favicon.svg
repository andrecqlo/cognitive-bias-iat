         the silhouette still reads as a brain. -->
    <path d="M16 8.6v14.8" />
    <path d="M16 9.4c-1.3-1.5-3.9-1.3-4.9.3-1.9-.3-3.3 1.3-2.9 3-1.6.8-1.9 3-.5 4.2-1.1 1.4-.4 3.5 1.2 4 .1 1.9 2.1 3 3.8 2.2.9 1.3 3 1.1 3.3-.5" />
    <path d="M16 9.4c1.3-1.5 3.9-1.3 4.9.3 1.9-.3 3.3 1.3 2.9 3 1.6.8 1.9 3 .5 4.2 1.1 1.4.4 3.5-1.2 4-.1 1.9-2.1 3-3.8 2.2-.9 1.3-3 1.1-3.3-.5" />
    <path d="M11.9 13.4c1.3.3 2.4 1.3 2.7 2.6" />
    <path d="M20.1 13.4c-1.3.3-2.4 1.3-2.7 2.6" />
  </g>
</svg>
