<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Hidden Associations">
  <!-- Solid tile rather than a bare glyph, so the mark holds on both light and
       dark tab bars. Flat fill, no gradient, in line with the palette. -->
