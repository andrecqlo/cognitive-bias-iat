name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Vercel deploys on its own; this only gates correctness, since a Vercel build
# runs `npm run build` without the test suite.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
