name: CI

on:
  pull_request:
  workflow_dispatch:

# Pull requests only. Pushes to main are covered by deploy.yml, which runs the
# same test and build steps before publishing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
